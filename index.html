<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің бірінші ИИ ассистентім</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h1 {
            color: #38bdf8;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #38bdf8;
            color: black;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Менің бірінші ИИ ассистентім</h1>
        <p>
            Бұл жоба — жасанды интеллект негізінде жасалған алғашқы веб-ассистентім.
            Ол сұрақтарға жауап беруге және қарапайым командаларды орындауға арналған.
        </p>

        <p>
            Жоба HTML, CSS және JavaScript көмегімен жасалған.
        </p>

        <a class="btn" href="assistant.html">Ассистентті ашу</a>
    </div>

</body>
</html>
